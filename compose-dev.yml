name: example-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NPM_REPOSITORY: ${NPM_REPOSITORY}
        NPM_TOKEN_READONLY: ${NPM_TOKEN_READONLY}
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./.nuxt:/app/.nuxt
    networks:
      - example-network
